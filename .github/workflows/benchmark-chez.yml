name: benchmark-chez
on:
  workflow_dispatch:
  push:
    paths: ['languages/chez/**','scripts/measure.py','spec/**','.github/workflows/benchmark-chez.yml']
permissions: {contents: read}
jobs:
  chez:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.x'}
      - name: Build latest stable Chez Scheme
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev uuid-dev zlib1g-dev libx11-dev
          tag="$(curl -fsSL https://api.github.com/repos/cisco/ChezScheme/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          git clone --depth 1 --branch "$tag" --recurse-submodules https://github.com/cisco/ChezScheme.git /tmp/chez-src
          (cd /tmp/chez-src && ./configure --threads && make -j2)
          bindir="$(find /tmp/chez-src -type f -name scheme -perm -111 | head -n1 | xargs dirname)"
          echo "$bindir" >> "$GITHUB_PATH"
      - run: python scripts/check_public_repo.py
      - run: sudo apt-get install -y time
      - run: python scripts/measure.py chez
      - uses: actions/upload-artifact@v4
        with: {name: benchmark-chez, path: results/chez.json}
