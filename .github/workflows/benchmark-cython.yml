name: benchmark-cython
on:
  workflow_dispatch:
  push:
    paths: ['languages/cython/**','scripts/measure.py','spec/**','.github/workflows/benchmark-cython.yml']
permissions: {contents: read}
jobs:
  cython:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.x', check-latest: true}
      - run: python -m pip install --upgrade pip setuptools wheel cython
      - run: python scripts/check_public_repo.py
      - run: sudo apt-get update && sudo apt-get install -y time
      - run: python scripts/measure.py cython
      - uses: actions/upload-artifact@v4
        with: {name: benchmark-cython, path: results/cython.json}
