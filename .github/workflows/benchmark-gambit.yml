name: benchmark-gambit
on:
  workflow_dispatch:
  push:
    paths: ['languages/gambit/**','scripts/measure.py','spec/**','.github/workflows/benchmark-gambit.yml']
permissions: {contents: read}
jobs:
  gambit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.x'}
      - name: Build latest stable Gambit
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev
          tag="$(
            git ls-remote --tags --refs https://github.com/gambit/gambit.git |
            awk '{print $2}' |
            sed 's#refs/tags/##' |
            grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+
          echo "$HOME/gambit/bin" >> "$GITHUB_PATH"
      - run: python scripts/check_public_repo.py
      - run: sudo apt-get install -y time
      - run: python scripts/measure.py gambit
      - uses: actions/upload-artifact@v4
        with: {name: benchmark-gambit, path: results/gambit.json}
 |
            sort -V |
            tail -n1
          )"
          test -n "$tag"
          git clone --depth 1 --branch "$tag" https://github.com/gambit/gambit.git /tmp/gambit-src
          (cd /tmp/gambit-src && ./configure --enable-single-host --prefix="$HOME/gambit" && make -j2 && make install)
          echo "$HOME/gambit/bin" >> "$GITHUB_PATH"
      - run: python scripts/check_public_repo.py
      - run: sudo apt-get install -y time
      - run: python scripts/measure.py gambit
      - uses: actions/upload-artifact@v4
        with: {name: benchmark-gambit, path: results/gambit.json}
