name: benchmark-gerbil
on:
  workflow_dispatch:
  push:
    paths: ['languages/gerbil/**','scripts/measure.py','spec/**','.github/workflows/benchmark-gerbil.yml']
permissions: {contents: read}
jobs:
  gerbil:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.x'}
      - name: Build latest stable Gerbil
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev libsqlite3-dev
          tag="$(curl -fsSL https://api.github.com/repos/mighty-gerbils/gerbil/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          curl -fsSL "https://github.com/mighty-gerbils/gerbil/archive/refs/tags/$tag.tar.gz" -o /tmp/gerbil.tar.gz
          mkdir -p /tmp/gerbil-src
          tar -xzf /tmp/gerbil.tar.gz --strip-components=1 -C /tmp/gerbil-src
          (cd /tmp/gerbil-src && ./configure --prefix="$HOME/gerbil" && make -j2 && make install)
          echo "$HOME/gerbil/bin" >> "$GITHUB_PATH"
          echo "GERBIL_HOME=$HOME/gerbil" >> "$GITHUB_ENV"
      - run: python scripts/check_public_repo.py
      - run: sudo apt-get install -y time
      - run: python scripts/measure.py gerbil
      - uses: actions/upload-artifact@v4
        with: {name: benchmark-gerbil, path: results/gerbil.json}
