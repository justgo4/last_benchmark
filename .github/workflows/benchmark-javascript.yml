name: benchmark-javascript

on:
  workflow_dispatch:
  push:
    paths:
      - 'languages/javascript/**'
      - 'scripts/measure.py'
      - 'scripts/check_public_repo.py'
      - 'spec/**'
      - '.github/workflows/benchmark-javascript.yml'

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 'node'
          check-latest: true
      - name: Public repository safety gate
        run: python scripts/check_public_repo.py
      - name: Install measurement dependency
        run: sudo apt-get update && sudo apt-get install -y time
      - name: Run JavaScript benchmark
        run: python scripts/measure.py javascript
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-javascript
          path: results/javascript.json
