name: benchmark-mojo
on:
  workflow_dispatch:
  push:
    paths: ['languages/mojo/**','scripts/measure.py','spec/**','.github/workflows/benchmark-mojo.yml']
permissions: {contents: read}
jobs:
  mojo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.x'}
      - name: Install exact latest stable Mojo
        run: |
          set -euo pipefail
          mojo_ver="$(
            curl -fsSL https://api.github.com/repos/modular/modular/releases/latest |
            python -c 'import json,re,sys; x=json.load(sys.stdin); m=re.search(r"Mojo ([0-9]+\.[0-9]+\.[0-9]+)", x["name"]); assert m; print(m.group(1))'
          )"
          python -m pip install --upgrade uv
          uv pip install --system "mojo==$mojo_ver"
          mojo --version
      - run: python scripts/check_public_repo.py
      - run: sudo apt-get update && sudo apt-get install -y time
      - run: python scripts/measure.py mojo
      - uses: actions/upload-artifact@v4
        with: {name: benchmark-mojo, path: results/mojo.json}
