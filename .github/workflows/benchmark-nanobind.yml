name: benchmark-nanobind
on:
  workflow_dispatch:
  push:
    paths: ['languages/nanobind/**','scripts/measure.py','spec/**','.github/workflows/benchmark-nanobind.yml']
permissions: {contents: read}
jobs:
  nanobind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.x', check-latest: true}
      - run: python -m pip install --upgrade pip nanobind
      - run: python scripts/check_public_repo.py
      - run: sudo apt-get update && sudo apt-get install -y time cmake ninja-build
      - run: python scripts/measure.py nanobind
      - uses: actions/upload-artifact@v4
        with: {name: benchmark-nanobind, path: results/nanobind.json}
