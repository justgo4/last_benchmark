name: benchmark-rust
on:
  workflow_dispatch:
  push:
    paths: ['languages/rust/**','scripts/measure.py','spec/**','.github/workflows/benchmark-rust.yml']
permissions: {contents: read}
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.x'}
      - name: Install latest stable Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: python scripts/check_public_repo.py
      - run: sudo apt-get update && sudo apt-get install -y time
      - run: python scripts/measure.py rust
      - uses: actions/upload-artifact@v4
        with: {name: benchmark-rust, path: results/rust.json}
