name: benchmark-swift
on:
  workflow_dispatch:
  push:
    paths: ['languages/swift/**','scripts/measure.py','spec/**','.github/workflows/benchmark-swift.yml']
permissions: {contents: read}
jobs:
  swift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.x'}
      - name: Install latest stable Swift with swiftly
        run: |
          set -euo pipefail
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" -o /tmp/swiftly.tar.gz
          tar -xzf /tmp/swiftly.tar.gz -C /tmp
          /tmp/swiftly init --quiet-shell-followup --assume-yes
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install latest --use --assume-yes
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/swiftly/toolchains/$(swiftly list --format json | python -c 'import json,sys; x=json.load(sys.stdin); print([i["name"] for i in x if i.get("inUse")][0])')/usr/bin" >> "$GITHUB_PATH"
      - run: python scripts/check_public_repo.py
      - run: sudo apt-get update && sudo apt-get install -y time
      - run: python scripts/measure.py swift
      - uses: actions/upload-artifact@v4
        with: {name: benchmark-swift, path: results/swift.json}
