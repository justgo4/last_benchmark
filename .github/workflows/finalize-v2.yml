name: finalize-v2

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Benchmark cohort commit SHA; leave blank to use the dispatch commit"
        required: false
        type: string
  workflow_run:
    workflows:
      - benchmark-c
      - benchmark-cpp
      - benchmark-c3
      - benchmark-cython
      - benchmark-nanobind
      - benchmark-pyo3
      - benchmark-rust
      - benchmark-zig
      - benchmark-v
      - benchmark-go
      - benchmark-haskell
      - benchmark-racket
      - benchmark-chez
      - benchmark-gambit
      - benchmark-gerbil
      - benchmark-sbcl
      - benchmark-java
      - benchmark-scala
      - benchmark-swift
      - benchmark-mojo
      - benchmark-typescript
      - benchmark-javascript
      - benchmark-nim
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: finalize-v2-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download complete same-commit v2 cohort
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ inputs.head_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,tempfile,urllib.parse,urllib.request,zipfile

          repo=os.environ["GH_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          target=(os.environ.get("WORKFLOW_RUN_SHA") or os.environ.get("DISPATCH_SHA") or os.environ["FALLBACK_SHA"]).strip()
          techs=["c","cpp","c3","cython","nanobind","pyo3","rust","zig","v","go","haskell","racket","chez","gambit","gerbil","sbcl","java","scala","swift","mojo","typescript","javascript","nim"]
          wanted={f"benchmark-{x}":x for x in techs}
          found={}

          def get(url):
              req=urllib.request.Request(
                  url,
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as r:
                  return r.read()

          q=urllib.parse.quote(target,safe="")
          for page in range(1,5):
              data=json.loads(get(f"https://api.github.com/repos/{repo}/actions/runs?head_sha={q}&status=success&per_page=100&page={page}"))
              for run in data.get("workflow_runs",[]):
                  name=run.get("name")
                  if name in wanted and name not in found:
                      found[name]=run
              if len(found)==len(wanted) or not data.get("workflow_runs"):
                  break

          missing=[name for name in wanted if name not in found]
          if missing:
              print(f"cohort {target[:12]} not complete; missing successful runs: "+", ".join(missing))
              raise SystemExit(0)

          results=pathlib.Path("results")
          results.mkdir(exist_ok=True)
          marker=pathlib.Path(os.environ.get("RUNNER_TEMP","/tmp"))/"v2_cohort_complete"
          marker.unlink(missing_ok=True)

          for workflow_name,lang in wanted.items():
              run=found[workflow_name]
              if run.get("head_sha") != target:
                  raise SystemExit(f"{workflow_name}: unexpected sha {run.get('head_sha')} != {target}")
              arts=json.loads(get(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100"))
              art=next((a for a in arts.get("artifacts",[]) if a.get("name")==f"benchmark-{lang}" and not a.get("expired")),None)
              if art is None:
                  raise SystemExit(f"missing artifact benchmark-{lang} for run {run['id']}")
              with tempfile.NamedTemporaryFile(suffix=".zip") as tmp:
                  subprocess.run([
                      "curl","-fsSL",
                      "-H",f"Authorization: Bearer {token}",
                      "-H","Accept: application/vnd.github+json",
                      "-H","X-GitHub-Api-Version: 2022-11-28",
                      f"https://api.github.com/repos/{repo}/actions/artifacts/{art['id']}/zip",
                      "-o",tmp.name,
                  ],check=True)
                  with zipfile.ZipFile(tmp.name) as z:
                      z.extractall(results)
              p=results/f"{lang}.json"
              if not p.exists():
                  raise SystemExit(f"artifact {art['id']} did not contain {p}")
              obj=json.loads(p.read_text())
              if obj.get("schema_version")!=2 or len(obj.get("workloads",[]))!=17:
                  raise SystemExit(f"{lang}: invalid v2 result payload")
              print(f"{lang}: run={run['id']} artifact={art['id']} sha={run['head_sha'][:12]}")

          (results/"v2_cohort_sha.txt").write_text(target+"\n")
          marker.write_text(target+"\n")
          print(f"downloaded complete {len(techs)}-technology cohort for {target}")
          PY

      - name: Check cohort completeness
        id: cohort
        run: |
          if [[ -f "$RUNNER_TEMP/v2_cohort_complete" ]]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render final v2 results
        if: steps.cohort.outputs.complete == 'true'
        run: python scripts/render_v2.py --write-readme

      - name: Public repository safety gate
        if: steps.cohort.outputs.complete == 'true'
        run: python scripts/check_public_repo.py

      - name: Commit final v2 report
        if: steps.cohort.outputs.complete == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/v2-*.svg
          git add -f results/summary_v2.json results/summary_v2.csv results/v2_cohort_sha.txt
          if git diff --cached --quiet; then
            echo "No final-result changes to commit"
            exit 0
          fi
          git commit -m "Publish same-commit benchmark v2 results"
          git push origin HEAD:main
