name: finalize-v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-v2.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download latest successful v2 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import io,json,os,pathlib,subprocess,tempfile,urllib.request,zipfile

          repo=os.environ["GH_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          techs=["c","cpp","c3","cython","nanobind","pyo3","rust","zig","v","go","haskell","racket","chez","gambit","gerbil","sbcl","java","scala","swift","mojo","typescript","javascript","nim"]
          wanted={f"benchmark-{x}":x for x in techs}
          found={}

          def get(url):
              req=urllib.request.Request(
                  url,
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as r:
                  return r.read()

          for page in range(1,8):
              data=json.loads(get(f"https://api.github.com/repos/{repo}/actions/runs?branch=main&status=success&per_page=100&page={page}"))
              for run in data.get("workflow_runs",[]):
                  name=run.get("name")
                  if name in wanted and name not in found:
                      found[name]=run
              if len(found)==len(wanted) or not data.get("workflow_runs"):
                  break

          missing=[name for name in wanted if name not in found]
          if missing:
              raise SystemExit("missing successful workflow runs: "+", ".join(missing))

          results=pathlib.Path("results")
          results.mkdir(exist_ok=True)

          for workflow_name,lang in wanted.items():
              run=found[workflow_name]
              arts=json.loads(get(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100"))
              art=next((a for a in arts.get("artifacts",[]) if a.get("name")==f"benchmark-{lang}" and not a.get("expired")),None)
              if art is None:
                  raise SystemExit(f"missing artifact benchmark-{lang} for run {run['id']}")
              with tempfile.NamedTemporaryFile(suffix=".zip") as tmp:
                  subprocess.run([
                      "curl","-fsSL",
                      "-H",f"Authorization: Bearer {token}",
                      "-H","Accept: application/vnd.github+json",
                      "-H","X-GitHub-Api-Version: 2022-11-28",
                      f"https://api.github.com/repos/{repo}/actions/artifacts/{art['id']}/zip",
                      "-o",tmp.name,
                  ],check=True)
                  with zipfile.ZipFile(tmp.name) as z:
                      z.extractall(results)
              p=results/f"{lang}.json"
              if not p.exists():
                  raise SystemExit(f"artifact {art['id']} did not contain {p}")
              obj=json.loads(p.read_text())
              if obj.get("schema_version")!=2 or len(obj.get("workloads",[]))!=17:
                  raise SystemExit(f"{lang}: invalid v2 result payload")
              print(f"{lang}: run={run['id']} artifact={art['id']} sha={run['head_sha'][:8]}")

          print(f"downloaded {len(techs)} successful v2 artifacts")
          PY

      - name: Render final v2 results
        run: python scripts/render_v2.py --write-readme

      - name: Commit final v2 report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/v2-*.svg
          git add -f results/summary_v2.json results/summary_v2.csv
          if git diff --cached --quiet; then
            echo "No final-result changes to commit"
            exit 0
          fi
          git commit -m "Publish benchmark v2 final results"
          git push origin HEAD:main
